<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Events | Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation is shared by every page of the website -->
    <nav>
        <a class="brand" href="index.html">City Community Charity</a>
        <a class="nav-link active" href="index.html">Home</a>
        <a class="nav-link" href="search.html">Search Events</a>
        <a class="nav-link nav-right" href="admin/index.html">Admin</a>
        <span class="nav-badge">A3</span>
    </nav>

    <main>
        <section class="hero">
            <h1>Welcome to City Community Charity</h1>
            <p>We raise funds and support local vulnerable community members through fun runs,
               gala dinners, silent auctions and charity concerts.</p>
        </section>

        <section>
            <h2>Upcoming Charity Events</h2>
            <div id="eventList" class="card-grid"></div>
            <div id="loadError" class="alert alert-error hidden"></div>
        </section>
    </main>

    <footer>&copy; 2026 City Community Charity &mdash; PROG2002 Assessment 3</footer>

    <!-- Shared API helper -->
    <script src="js/api.js"></script>
    <script>
        /**
         * Home page: load the upcoming (active and future) events from
         * GET /api/events/upcoming and render them as cards.
         */
        async function loadUpcomingEvents() {
            const container = document.getElementById('eventList');
            const errorBox = document.getElementById('loadError');
            try {
                const result = await apiGet('/api/events/upcoming');

                if (!result.data.length) {
                    container.innerHTML = '<div class="empty-state">There are no upcoming events at the moment.</div>';
                    return;
                }

                container.innerHTML = result.data.map(evt => `
                    <div class="event-card">
                        <h3>${escapeHtml(evt.event_title)}</h3>
                        <p><span class="badge badge-category">${escapeHtml(evt.category_name)}</span></p>
                        <p><strong>Date:</strong> ${formatDateTime(evt.event_date)}</p>
                        <p><strong>Location:</strong> ${escapeHtml(evt.location)}</p>
                        <p><strong>Tickets:</strong> ${Number(evt.ticket_price) > 0 ? formatCurrency(evt.ticket_price) + ' each' : 'Free entry'}</p>
                        <div class="card-actions">
                            <a class="btn btn-primary" href="event-detail.html?id=${evt.event_id}">View Details</a>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                errorBox.textContent = 'Failed to load events: ' + err.message;
                errorBox.classList.remove('hidden');
            }
        }

        loadUpcomingEvents();
    </script>
</body>
</html>
