<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Detail</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a class="brand" href="index.html">City Community Charity</a>
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="search.html">Search Events</a>
        <a class="nav-link nav-right" href="admin/index.html">Admin</a>
        <span class="nav-badge">A3</span>
    </nav>

    <main id="detailContainer">
        <div class="empty-state">Loading event details&hellip;</div>
    </main>

    <footer>&copy; 2026 City Community Charity &mdash; PROG2002 Assessment 3</footer>

    <script src="js/api.js"></script>
    <script>
        /**
         * Event details page (enhanced in A3).
         *   - GET /api/events/:id          -> event details + registrations list
         *   - GET /api/events/:id/weather  -> optional Open-Meteo forecast
         * The "Register" button navigates to register.html passing the event id.
         */
        const eventId = getQueryParam('id');

        async function loadDetail() {
            const container = document.getElementById('detailContainer');

            if (!eventId || Number.isNaN(Number(eventId))) {
                container.innerHTML = '<div class="alert alert-error">No valid event id was supplied.</div>';
                return;
            }

            try {
                const result = await apiGet(`/api/events/${eventId}`);
                const evt = result.data;
                const goal = Number(evt.fundraising_goal) || 0;
                const progressPercent = goal > 0
                    ? Math.min((Number(evt.current_progress) / goal) * 100, 100)
                    : 0;

                container.innerHTML = `
                    <div class="card">
                        <h1 class="page-title">${escapeHtml(evt.event_title)}</h1>
                        <p class="page-subtitle">
                            <span class="badge badge-category">${escapeHtml(evt.category_name)}</span>
                            <span class="${statusBadgeClass(evt.event_status)}">${escapeHtml(evt.event_status)}</span>
                        </p>

                        <div class="info-grid">
                            <div class="info-item"><strong>Date</strong><p>${formatDateTime(evt.event_date)}</p></div>
                            <div class="info-item"><strong>Location</strong><p>${escapeHtml(evt.location)}</p></div>
                            <div class="info-item"><strong>Ticket Price</strong><p>${Number(evt.ticket_price) > 0 ? formatCurrency(evt.ticket_price) : 'Free entry'}</p></div>
                            <div class="info-item"><strong>Organisation</strong><p>${escapeHtml(evt.organisation_name)}</p></div>
                        </div>

                        <div class="progress-section">
                            <div class="progress-info">
                                <div><strong>Current Progress</strong><p>${formatCurrency(evt.current_progress)}</p></div>
                                <div><strong>Fundraising Goal</strong><p>${formatCurrency(evt.fundraising_goal)}</p></div>
                                <div><strong>Tickets Sold</strong><p>${evt.tickets_sold || 0}</p></div>
                            </div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progressPercent}%"></div></div>
                        </div>

                        <h3>Description</h3>
                        <p style="white-space:pre-line;">${escapeHtml(evt.event_description)}</p>

                        <div id="weatherBox"></div>

                        <div class="btn-row">
                            <a class="btn btn-primary btn-lg" href="register.html?id=${evt.event_id}">Register for this event</a>
                            <a class="btn btn-outline" href="search.html">Back to search</a>
                        </div>
                    </div>

                    <section style="margin-top:2.5rem;">
                        <h2>Registrations for this event</h2>
                        ${renderRegistrations(evt.registrations)}
                    </section>
                `;

                loadWeather();
            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">Cannot load event details: ${escapeHtml(err.message)}</div>`;
            }
        }

        /**
         * Render the registration list. The API already sorts the records by
         * registration_date DESC (latest purchase first).
         */
        function renderRegistrations(registrations) {
            if (!registrations || registrations.length === 0) {
                return '<div class="empty-state">No one has registered for this event yet. Be the first!</div>';
            }
            const rows = registrations.map(r => `
                <tr>
                    <td>#${r.registration_id}</td>
                    <td>${escapeHtml(r.attendee_name)}</td>
                    <td>${escapeHtml(r.attendee_email)}</td>
                    <td>${escapeHtml(r.contact_phone)}</td>
                    <td>${r.tickets_purchased}</td>
                    <td>${formatCurrency(r.total_amount)}</td>
                    <td>${formatDateTime(r.registration_date)}</td>
                    <td>${escapeHtml(r.registration_status)}</td>
                </tr>
            `).join('');
            return `
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
                                <th>Tickets</th><th>Total</th><th>Registered</th><th>Status</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <p class="form-hint">Sorted by the latest date the tickets were purchased.</p>
            `;
        }

        /** Optional external API: Open-Meteo forecast for the event day. */
        async function loadWeather() {
            const box = document.getElementById('weatherBox');
            try {
                const result = await apiGet(`/api/events/${eventId}/weather`);
                const w = result.data;
                box.innerHTML = `
                    <div class="weather-box">
                        <div class="weather-icon">&#9925;</div>
                        <div>
                            <div class="weather-desc">Weather forecast for ${formatDateTime(w.date).split(',')[0]}</div>
                            <div class="weather-temp">${w.temperature_min}&deg;C &ndash; ${w.temperature_max}&deg;C</div>
                            <div>${escapeHtml(w.description)}${w.precipitation_probability !== null ? ` &middot; ${w.precipitation_probability}% chance of rain` : ''}</div>
                        </div>
                    </div>`;
            } catch (err) {
                // The weather API is optional, so a failure is shown as info only.
                box.innerHTML = `<div class="alert alert-info">Weather forecast unavailable: ${escapeHtml(err.message)}</div>`;
            }
        }

        loadDetail();
    </script>
</body>
</html>
